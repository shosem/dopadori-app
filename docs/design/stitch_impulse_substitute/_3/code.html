        body {
            background-color: var(--tw-colors-background);
        }
        .glass-panel {
            background: rgba(246, 250, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

<body class="min-h-screen flex items-center justify-center px-margin-mobile md:px-margin-desktop pt-24 pb-24 text-on-background font-body-md bg-background">
<!-- Header -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<div class="font-headline-md text-headline-md text-primary tracking-tight">
            Dopadori
        </div>
</div>
</header>
<main class="w-full max-w-md mx-auto">
<!-- Header / Logo Area inside Content -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 text-primary mb-md">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">self_care</span>
</div>
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary tracking-tight mb-xs">
                おかえりなさい
            </h1>
<p class="text-body-md font-body-md text-on-surface-variant">
                今日も穏やかな一日になりますように
            </p>
</div>
<!-- Login Form Container -->
<div class="glass-panel rounded-xl p-md md:p-lg shadow-[0_32px_64px_-16px_rgba(43,96,133,0.1)]">
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="email">
                        メールアドレス
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/60 text-xl">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface/50 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block text-label-md font-label-md text-on-surface" for="password">
                            パスワード
                        </label>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/60 text-xl">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface/50 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-label-md font-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 active:scale-[0.98]" type="submit">
                        ログイン
                    </button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                アカウントをお持ちでないですか？
                <a class="font-medium text-primary hover:text-primary-container transition-colors ml-1" href="#">
                    はじめての方はこちら
                </a>
</p>
</div>
</main>
